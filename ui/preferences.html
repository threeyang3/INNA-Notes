<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; base-uri 'none'; form-action 'none'">
  <title>IINA Video Notes 设置</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body class="preferences-body">
  <main>
    <h2>IINA Video Notes</h2>
    <p>在播放窗口的「插件」菜单中，打开本插件的设置入口，可以选择保存目录、默认字幕模式、自动暂停、快捷键与路径隐私选项。</p>
    <p>默认保存到插件的持久数据目录。选择 Obsidian Vault 内的收件箱后，Markdown 和截图可以直接在 Obsidian 中阅读。</p>
    <p>更改输出目录不会迁移已有记录。未保存的内容可从「草稿」入口恢复。</p>
    <p class="fine-print">插件独立采集本地视频，不需要 MediaCore 或 Obsidian 运行，不上传视频、截图或笔记。</p>
  </main>
</body>
</html>
